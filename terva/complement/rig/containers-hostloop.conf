# Read by the private podman service run.sh starts when HOST_LOOPBACK=1.
# host-gateway, and so host.docker.internal and host.containers.internal,
# resolves to 169.254.1.3, which pasta translates to the host's loopback, where
# the confined appservice listeners are. Podman's own mapping of 169.254.1.2
# reaches the host's LAN address, where nothing of the harness listens.
[containers]
host_containers_internal_ip = "169.254.1.3"

[network]
pasta_options = ["--map-host-loopback", "169.254.1.3"]
