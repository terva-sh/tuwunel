# Raw TLS relay. It has no certificate, key, token or caller-selected destination.
global
    maxconn 64
    nbthread 1

defaults
    mode tcp
    timeout connect 5s
    timeout client 300s
    timeout server 300s

frontend local_tls
    bind :8448
    default_backend homeserver_tls

backend homeserver_tls
    server homeserver homeserver:8448 check
